spring.application.name=nss-backend
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/nss_website
spring.datasource.username=nss_app
spring.datasource.password=${NSS_DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
